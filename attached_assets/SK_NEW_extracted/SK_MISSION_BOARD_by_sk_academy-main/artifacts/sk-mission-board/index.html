<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport: covers all Android screen sizes, no auto-scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />

    <!-- Primary SEO -->
    <title>SK Mission Board — Bihar Board Class 10 Study Platform</title>
    <meta name="description" content="SK Mission Board — Free premium notes and video lectures for Bihar Board Class 10 students. Chapter-wise PDFs, all subjects covered." />
    <meta name="robots" content="index, follow" />
    <meta name="keywords" content="Bihar Board Class 10, BSEB notes, chapter PDFs, free study material, SK Mission Board" />
    <meta name="author" content="SK Mission Board" />

    <!-- PWA & Theme -->
    <meta name="theme-color" content="#7c3bed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="SK Mission Board" />

    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SK Board" />

    <!-- Android WebView compatibility -->
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Open Graph -->
    <meta property="og:title" content="SK Mission Board — Bihar Board Class 10 Study Platform" />
    <meta property="og:description" content="Free premium notes and video lectures for Bihar Board Class 10 students. Chapter-wise PDFs, all subjects covered." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skmissionboard.com" />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:site_name" content="SK Mission Board" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SK Mission Board — Bihar Board Class 10 Study Platform" />
    <meta name="twitter:description" content="Free premium notes and video lectures for Bihar Board Class 10 students. Chapter-wise PDFs, all subjects covered." />
    <meta name="twitter:image" content="/icons/icon-512x512.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
