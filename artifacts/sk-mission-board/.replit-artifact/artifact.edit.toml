kind = "web"
previewPath = "/"
title = "SK Mission Board"
version = "1.0.0"
id = "artifacts/sk-mission-board"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26064

[services.development]
run = "pnpm --filter @workspace/sk-mission-board run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sk-mission-board", "run", "build" ]
serve = "static"
publicDir = "artifacts/sk-mission-board/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26064"
BASE_PATH = "/"
